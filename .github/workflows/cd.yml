# ─────────────────────────────────────────────────────────────────────────────
# CD pipeline — brownfield
#
# Triggers: push to main (after CI passes).
#
# Builds the Docker image and pushes it to GitHub Container Registry (ghcr.io).
# Image is tagged with both "latest" and the short commit SHA so rollbacks are
# trivial.
#
# To deploy to a VM/server via SSH, uncomment and configure the
# "Deploy to server via SSH" step at the bottom of this file.
# ─────────────────────────────────────────────────────────────────────────────

name: CD

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Image name follows the pattern ghcr.io/<owner>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ANTHROPIC_API_KEY is NOT baked into the image.
          # It is injected at runtime via -e / environment variable.
          build-args: |
            ANTHROPIC_API_KEY=

      # ── Optional: Deploy to a VM/server via SSH ───────────────────────────
      # Uncomment this step and configure the required secrets in your repo:
      #   SSH_HOST       — hostname or IP of the target server
      #   SSH_USER       — SSH login username (e.g. ubuntu, deploy)
      #   SSH_PRIVATE_KEY — PEM-formatted private key (no passphrase)
      #   ANTHROPIC_API_KEY — the real API key for the running container
      #
      # - name: Deploy to server via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
